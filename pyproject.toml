[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-number-check"
version = "0.1.0"
description = "Finds the figures in a narrative donor report that disagree with the indicator spreadsheet behind it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
numcheck = "numcheck.cli:main"

[tool.setuptools.packages.find]
include = ["numcheck*"]

[tool.setuptools.package-data]
numcheck = ["config/*.toml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
